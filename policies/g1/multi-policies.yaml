# ============================================================
# G1 Multi-Policy Master Config
# ============================================================
# This file manages multiple RL policies with gamepad-triggered
# transitions.  Each sub-config is a standard policy config.yaml
# that also works standalone (backward compatible).
#
# Transition trigger format:
#   "button"       — on_press of that button
#   "L2+button"    — L2 held + on_press of button
#
# Available buttons:
#   A B X Y  up down left right  L1 R1 R2  start  F1 F2
# ============================================================

# lowlevel controller (shared across all policies)
llc_config_file: src/unitree_lowlevel/config/g1.yaml

# override lowlevel dt if needed
ll_dt: 0.005

# clip final torque (shared)
clip_final_tau: false

# FSM definition
fsm:
  # The policy to activate when entering HighController state
  default: velocity

  policies:
    # ---- velocity (walking / balancing) ----
    velocity:
      config: src/legged_rl_deploy/policies/g1/velocity/unitree_rl_mjlab/config.yaml
      transitions:
        dance1_subject2: R1 + A
        dance_102: R1 + B
        gangnam_style: R1 + X
        jumps1_subject1: R1 + Y
        dance1_subject1: L1 + A
        aba-jumps1_subject1: L1 + B

    # unitree_rl_mjlab
    dance1_subject2:
      config: src/legged_rl_deploy/policies/g1/mimic/unitree_rl_mjlab/dance1_subject2/config.yaml
      transitions:
        velocity: R2 + A

    # unitree_rl_lab
    dance_102:
      config: src/legged_rl_deploy/policies/g1/mimic/unitree_rl_lab/dance_102/config.yaml
      transitions:
        velocity: R2 + A

    gangnam_style:
      config: src/legged_rl_deploy/policies/g1/mimic/unitree_rl_lab/gangnam_style/config.yaml
      transitions:
        velocity: R2 + A

    # whole_body_tracking
    # TODO: this motion seems faster than aba-jumps1_subject1, reason unknown.
    jumps1_subject1:
      config: src/legged_rl_deploy/policies/g1/mimic/whole_body_tracking/jumps1_subject1/config.yaml
      transitions:
        velocity: R2 + A

    # mjlab 
    dance1_subject1:
      config: src/legged_rl_deploy/policies/g1/mimic/mjlab/dance1_subject1/config.yaml
      transitions:
        velocity: R2 + A

    aba-jumps1_subject1:
      config: src/legged_rl_deploy/policies/g1/mimic/aba/jumps1_subject1/config.yaml
      transitions:
        velocity: R2 + A