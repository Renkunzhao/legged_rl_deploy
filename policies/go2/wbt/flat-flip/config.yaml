# =============================================================================
# IsaacLab Go2 side-flip deploy config
# Source ONNX: whole_body_tracking_hd/logs/rsl_rl/go2_tracking/
#   2026-03-22_02-51-54_go2_sideflip_right_fps50_no_se_4096env_10k_height_r3_tighter_z/exported/policy.onnx
# =============================================================================

llc_config_file: src/unitree_lowlevel/config/go2.yaml
ll_dt: 0.005

policy:
  backend: ort
  model_path: src/legged_rl_deploy/policies/go2/wbt/flat/policy.onnx
  input_dim: 69
  output_dim: 12
  policy_dt: 0.02

  # IsaacLab training joint order from ONNX metadata:
  # [FL_h, FR_h, RL_h, RR_h, FL_t, FR_t, RL_t, RR_t, FL_c, FR_c, RL_c, RR_c]
  # Map policy order to lowlevel motor order (FR, FL, RR, RL).
  joint_ids_map: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]

  stiffness: [17.692, 17.692, 17.692, 17.692, 17.692, 17.692, 17.692, 17.692, 65.219, 65.219, 65.219, 65.219]
  damping:   [ 1.126,  1.126,  1.126,  1.126,  1.126,  1.126,  1.126,  1.126,  4.152,  4.152,  4.152,  4.152]

  commands: {}

  actions:
    JointPositionAction:
      process_order: [scale, offset]
      scale:  [0.335, 0.335, 0.335, 0.335, 0.335, 0.335, 0.335, 0.335, 0.174, 0.174, 0.174, 0.174]
      offset: [-0.100, 0.100, -0.100, 0.100, 0.900, 0.900, 0.900, 0.900, -1.800, -1.800, -1.800, -1.800]

  observations:
    terms:
      # IsaacLab policy obs layout from ONNX metadata:
      # command(24) + motion_anchor_ori_b(6) + base_ang_vel(3) + joint_pos(12) + joint_vel(12) + actions(12)
      # Deploy reconstructs command + motion_anchor_ori_b using the ONNX motion branch.
      mimic:
        params:
          source: local
          dim: 30
          terms: [joint_pos, joint_vel, motion_anchor_ori_b]
          local:
            file: src/legged_rl_deploy/policies/go2/wbt/flat/policy.onnx
            fps: 50
            hardware_order: false

      base_ang_vel_B:

      joint_pos:
        process_order: [offset]
        offset: [0.100, -0.100, 0.100, -0.100, -0.900, -0.900, -0.900, -0.900, 1.800, 1.800, 1.800, 1.800]

      joint_vel:

      last_action:
