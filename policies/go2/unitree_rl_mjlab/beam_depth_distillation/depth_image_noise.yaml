depth_image_noise:
  seed: 42
  process_order: [correlated_dropout, pixel_dropout]

  # Low-resolution Gaussian field, bilinearly expanded and evolved per frame.
  correlated_dropout:
    cell_size_px: 4
    threshold_std: 2.65
    temporal_correlation: 0.95

  pixel_dropout:
    probability: 0.002
